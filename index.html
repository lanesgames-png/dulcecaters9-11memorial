<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Portal Test</title>
<style>
    body {
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
    }

    #searchBar {
        margin: 20px auto;
        width: 300px;
        padding: 10px;
    }

    #games {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        padding: 20px;
    }

    .game-card {
        width: 200px;
        background: #222;
        padding: 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    .game-card:hover {
        background: #333;
    }

    iframe {
        width: 90%;
        height: 500px;
        border: none;
        background: #000;
        margin-top: 20px;
    }
</style>
</head>

<body>

<h1>Game Portal Test</h1>
<input id="searchBar" placeholder="Search games…">

<div id="games"></div>

<iframe id="gameframe"></iframe>

<script>
const gameList = [
  { name: "1v1.lol", url: "https://1v1.lol" },
  { name: "Retro Bowl", url: "https://footballretro.netlify.app" },
  { name: "Cookie Clicker", url: "https://orteil.dashnet.org/cookieclicker/" },
  { name: "Slope", url: "https://slope-game.github.io/slope/" }
];

const gamesContainer = document.getElementById("games");
const searchBar = document.getElementById("searchBar");
const gameFrame = document.getElementById("gameframe");

function loadGames(list) {
  gamesContainer.innerHTML = "";
  list.forEach(game => {
    const div = document.createElement("div");
    div.className = "game-card";
    div.textContent = game.name;
    div.addEventListener("click", () => {
      console.log("Loading:", game.url);
      gameFrame.src = game.url;
      window.scrollTo(0, document.body.scrollHeight);
    });
    gamesContainer.appendChild(div);
  });
}

searchBar.addEventListener("input", () => {
  const value = searchBar.value.toLowerCase();
  const filtered = gameList.filter(g => g.name.toLowerCase().includes(value));
  loadGames(filtered);
});

loadGames(gameList);
</script>
</body>
</html>
