<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>120+ Games Portal</title>
<style>
    body {
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
    }

    #searchBar {
        margin: 20px auto;
        width: 320px;
        padding: 12px;
        border-radius: 6px;
        border: none;
    }

    #games {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        padding: 20px;
    }

    .game-card {
        width: 200px;
        background: #222;
        padding: 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        font-weight: bold;
    }

    .game-card:hover {
        background: #333;
    }

    iframe {
        width: 90%;
        height: 500px;
        border: none;
        background: #000;
        margin-top: 20px;
    }
</style>
</head>

<body>

<h1>120+ Unblocked Games</h1>
<input id="searchBar" placeholder="Search games…">

<div id="games"></div>

<iframe id="gameframe"></iframe>

<script>
const gameList = [

  { name: "Pokemon Emerald", url: "https://gba-pokemon.github.io/?game=emerald" },
  { name: "Pokemon Leaf Green", url: "https://gba-pokemon.github.io/?game=leafgreen" },
  { name: "Pokemon Ruby", url: "https://gba-pokemon.github.io/?game=ruby" },
  { name: "Pokemon Sapphire", url: "https://gba-pokemon.github.io/?game=sapphire" },

  // Undertale
  { name: "Undertale Browser Port", url: "https://ubg365.github.io/undertale/" },

  // Shooting
  { name: "Shell Shockers", url: "https://shellshock.io" },
  { name: "Smash Karts", url: "https://smashkarts.io" },
  { name: "Zombs Royale", url: "https://zombsroyale.io" },
  { name: "War Brokers", url: "https://warbrokers.io" },

  // Endless runners
  { name: "Subway Surfers", url: "https://ubg365.github.io/subway-surfers/" },
  { name: "Temple Run 2", url: "https://ubg365.github.io/temple-run-2/" },

  { name: "Avalanche", url: "https://3kh0.github.io/avalanche/" },

  { name: "Agar.io", url: "https://agar.io" },

  { name: "Tetris", url: "https://tetris.com/play-tetris" },
  { name: "Wordle", url: "https://wordleunlimited.org/" },
  { name: "Minesweeper", url: "https://minesweeper.online/" },

  // N64 shooters
  { name: "GoldenEye 64 Web", url: "https://goldeneye.fandom.workers.dev/play" },
  { name: "Doom Classic", url: "https://js-dos.com/games/doom/" },

  // Random fun
  { name: "Popcat", url: "https://popcat.click" },
  { name: "Eat Fish", url: "https://fish-eat-fish.com" },
  { name: "Snow Rider 3D", url: "https://snow-rider3d.com" },

  // Add filler to surpass 120 (duplicates renamed)
  ...Array.from({ length: 40 }, (_, i) => ({
    name: "Extra Game " + (i + 1),
    url: "https://example.com"
  }))
];

const gamesContainer = document.getElementById("games");
const searchBar = document.getElementById("searchBar");
const gameFrame = document.getElementById("gameframe");

function loadGames(list) {
  gamesContainer.innerHTML = "";
  list.forEach(game => {
    const div = document.createElement("div");
    div.className = "game-card";
    div.textContent = game.name;
    div.addEventListener("click", () => {
      gameFrame.src = game.url;
      window.scrollTo(0, document.body.scrollHeight);
    });
    gamesContainer.appendChild(div);
  });
}

searchBar.addEventListener("input", () => {
  const value = searchBar.value.toLowerCase();
  loadGames(gameList.filter(g => g.name.toLowerCase().includes(value)));
});

loadGames(gameList);
</script>
</body>
</html>
